<svg viewBox="0 0 450 200" width="450" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rosso Mars / Rosso Bia Metallic Italian Racing Red Gradients -->
    <linearGradient id="lamboRedBody" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#880e14" />
      <stop offset="20%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="75%" stop-color="#ef4444" />
      <stop offset="90%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <linearGradient id="lamboDarkCarbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <linearGradient id="lamboGlass" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="40%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <linearGradient id="lamboGlassSheen" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)" />
      <stop offset="45%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
  </defs>

  <!-- Ambient Underbody Ground Shadow -->
  <ellipse cx="225" cy="102" rx="210" ry="78" fill="rgba(0,0,0,0.55)" filter="blur(8px)" />

  <!-- Wheels (Pirelli P Zero with red performance calipers) -->
  <rect x="74" y="16" width="58" height="16" rx="3" fill="#111113" />
  <rect x="78" y="20" width="50" height="7" rx="2" fill="#27272a" />
  <line x1="85" y1="18" x2="120" y2="18" stroke="#e11d48" stroke-width="1.5" />

  <rect x="74" y="168" width="58" height="16" rx="3" fill="#111113" />
  <rect x="78" y="173" width="50" height="7" rx="2" fill="#27272a" />
  <line x1="85" y1="182" x2="120" y2="182" stroke="#e11d48" stroke-width="1.5" />

  <rect x="316" y="22" width="54" height="15" rx="3" fill="#111113" />
  <rect x="320" y="26" width="46" height="6" rx="2" fill="#27272a" />
  <line x1="326" y1="24" x2="358" y2="24" stroke="#e11d48" stroke-width="1.5" />

  <rect x="316" y="163" width="54" height="15" rx="3" fill="#111113" />
  <rect x="320" y="168" width="46" height="6" rx="2" fill="#27272a" />
  <line x1="326" y1="176" x2="358" y2="176" stroke="#e11d48" stroke-width="1.5" />

  <!-- Main Monocoque Body Chassis (Iconic Angular Lamborghini Wedge) -->
  <path d="M 432 100 L 416 76 L 370 48 L 325 36 L 270 34 L 220 30 L 155 30 L 110 32 L 60 48 L 32 74 L 22 100 L 32 126 L 60 152 L 110 168 L 155 170 L 220 170 L 270 166 L 325 164 L 370 152 L 416 124 Z" fill="url(#lamboRedBody)" stroke="#7f1d1d" stroke-width="1.5" />

  <!-- Front Pointed Wedge Nose & Carbon Splitters -->
  <polygon points="436,100 412,82 396,88 412,100 396,112 412,118" fill="#09090b" />
  <path d="M 434 100 L 418 64 L 406 68 L 420 98 L 420 102 L 406 132 L 418 136 Z" fill="#18181b" stroke="#27272a" stroke-width="1" />

  <!-- Front Bonnet Ducts -->
  <polygon points="410,100 365,78 320,80 340,100 320,120 365,122" fill="#991b1b" opacity="0.65" />
  <polygon points="412,100 380,88 335,88 355,100 335,112 380,112" fill="#09090b" />
  <polygon points="375,76 345,74 348,70 376,72" fill="#09090b" />
  <polygon points="375,124 345,126 348,130 376,128" fill="#09090b" />

  <!-- Iconic Y-Shaped Headlights -->
  <path d="M 405 68 L 388 74 L 372 74 M 388 74 L 380 64" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="406,68 387,74 372,74 378,71 392,71" fill="#e0f2fe" opacity="0.9" />
  <path d="M 405 132 L 388 126 L 372 126 M 388 126 L 380 136" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="406,132 387,126 372,126 378,129 392,129" fill="#e0f2fe" opacity="0.9" />

  <!-- Angular Geometric Side Mirrors -->
  <polygon points="295,34 308,18 318,20 306,35" fill="#ef4444" stroke="#18181b" stroke-width="1.2" />
  <polygon points="295,166 308,182 318,180 306,165" fill="#ef4444" stroke="#18181b" stroke-width="1.2" />

  <!-- Carbon Fiber V12 Side Air Intake Pods -->
  <polygon points="245,34 200,32 170,42 225,48" fill="#09090b" />
  <polygon points="242,34 205,33 175,41 220,46" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <line x1="215" y1="35" x2="190" y2="42" stroke="#3f3f46" stroke-width="1.5" />

  <polygon points="245,166 200,168 170,158 225,152" fill="#09090b" />
  <polygon points="242,166 205,167 175,159 220,154" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <line x1="215" y1="165" x2="190" y2="158" stroke="#3f3f46" stroke-width="1.5" />

  <!-- Cockpit Canopy & Windshield -->
  <polygon points="315,100 298,62 250,54 185,54 140,68 120,100 140,132 185,146 250,146 298,138" fill="#09090b" />
  <polygon points="310,100 295,66 252,58 252,142 295,134" fill="url(#lamboGlass)" stroke="#18181b" stroke-width="1.5" />
  <polygon points="306,98 292,68 258,62 264,100" fill="url(#lamboGlassSheen)" />

  <!-- Carbon Fiber Roof Panel -->
  <polygon points="252,58 200,56 168,66 168,134 200,144 252,142" fill="url(#lamboDarkCarbon)" />
  <line x1="252" y1="100" x2="168" y2="100" stroke="#09090b" stroke-width="3" />

  <!-- V12 Slotted Louver Engine Deck -->
  <polygon points="168,68 115,74 95,100 115,126 168,132" fill="#111113" stroke="#27272a" stroke-width="1.5" />
  <polygon points="160,74 150,75 142,100 150,125 160,126" fill="#1f2937" stroke="#09090b" stroke-width="1" />
  <polygon points="146,78 136,80 130,100 136,120 146,122" fill="#1f2937" stroke="#09090b" stroke-width="1" />
  <polygon points="132,83 122,85 118,100 122,115 132,117" fill="#1f2937" stroke="#09090b" stroke-width="1" />
  <polygon points="118,88 110,90 106,100 110,110 118,112" fill="#1f2937" stroke="#09090b" stroke-width="1" />

  <!-- SVJ Aerodynamic Rear Wing & Center ALA Fin -->
  <polygon points="105,100 50,98 30,100 50,102" fill="#09090b" stroke="#ef4444" stroke-width="1" />
  <path d="M 46 100 L 38 60 L 20 48 L 12 52 L 26 72 L 24 100 L 26 128 L 12 148 L 20 152 L 38 140 Z" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
  <polygon points="20,48 12,52 26,72 32,68" fill="#dc2626" />
  <polygon points="20,152 12,148 26,128 32,132" fill="#dc2626" />

  <!-- Centered Dual High-Exit Titanium Exhausts -->
  <circle cx="44" cy="93" r="5.5" fill="#09090b" stroke="#38bdf8" stroke-width="1.8" />
  <circle cx="44" cy="93" r="3.5" fill="#000000" />
  <circle cx="44" cy="107" r="5.5" fill="#09090b" stroke="#38bdf8" stroke-width="1.8" />
  <circle cx="44" cy="107" r="3.5" fill="#000000" />

  <!-- Rear Diffuser Aero Fins -->
  <polygon points="32,80 20,82 20,86 32,84" fill="#18181b" />
  <polygon points="32,120 20,118 20,114 32,116" fill="#18181b" />

  <!-- Highlights Along Sharp Geometric Crease Lines -->
  <polyline points="432,100 370,48 270,34" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" />
  <polyline points="432,100 370,152 270,166" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" />
</svg>